<title>迷霧地圖</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="vendor/MarkerCluster.css"><link rel="stylesheet" href="style.css"></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset=".45" stop-color="#e8c25a"/><stop offset="1" stop-color="#a8701c"/></linearGradient>
 <radialGradient id="haloG"><stop offset="0" stop-color="#ffe27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffcf4a" stop-opacity="0"/></radialGradient>
 <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
 <symbol id="i-boot" viewBox="0 0 24 24"><path d="M8 2.5h5.5v8.2l5 2.6c1.6.8 2.3 1.9 2.3 3.4v2.3H4.6v-3.6l3.4-2.2z M4.6 19h16.2v2.5H4.6z" fill="currentColor"/></symbol>
 <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4.5l2.4 7.5L12 19.5 9.6 12z" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="#1b1d45"/></symbol>
 <symbol id="i-castle" viewBox="0 0 24 24"><path d="M3 21V9h2.5v2H8V9h2.5v2H13V9h2.5v2H18V9h2.5v12h-6.5v-4.5a2 2 0 0 0-4 0V21z M10.3 2l3.5 2-3.5 2z M10.3 2v7" fill="currentColor" stroke="currentColor" stroke-width=".9"/></symbol>
 <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 18 2 7l5.5 4.5L12 4l4.5 7.5L22 7l-1 11z M3.2 19.5h17.6V22H3.2z" fill="currentColor"/></symbol>
 <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 22V2.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M6 3.5h13l-3.5 4.5 3.5 4.5H6z" fill="currentColor"/></symbol>
 <symbol id="i-orb" viewBox="0 0 24 24"><circle cx="12" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 8.2a4 4 0 0 1 3.5-2.4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M6 21.5l2-4h8l2 4z" fill="currentColor"/></symbol>
 <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M6 3h12.5a2.5 2.5 0 0 1 0 5H18v11a2.5 2.5 0 0 1-2.5 2.5H5.5a2.5 2.5 0 0 1 0-5H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 9h5M9.5 12.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
 <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 20.5 5v6.5c0 5-3.6 9-8.5 10.5C7.1 20.5 3.5 16.5 3.5 11.5V5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 6.5l1.6 3.4 3.6.4-2.7 2.5.8 3.6L12 14.6l-3.3 1.8.8-3.6-2.7-2.5 3.6-.4z" fill="currentColor"/></symbol>
 <symbol id="i-steps" viewBox="0 0 24 24"><path d="M7.5 2.5c2.3 0 3.3 2.6 3 5.6-.2 2.4-1 4.2-3.2 4.2S4.2 10.5 4.2 8C4.2 5 5.4 2.5 7.5 2.5zM5 14h5.2c.2 2.4-.6 4.6-2.6 4.6S4.9 16.6 5 14zM16.5 6.5c2.1 0 3.3 2.5 3.3 5.5 0 2.5-.9 4.3-3.1 4.3s-3-1.8-3.2-4.2c-.3-3 .7-5.6 3-5.6zM14 18h5.2c.1 2.6-.6 4.6-2.6 4.6s-2.8-2.2-2.6-4.6z" fill="currentColor"/></symbol>
</defs></svg>
<div id="map"></div>
<header id="hud" class="frame">
 <div class="hrow">
  <button class="medal" id="medal" aria-label="公會卡"><span class="lvl">Lv<b id="lv">1</b></span></button>
  <div class="who"><div class="nm"><b id="hname">旅人</b><span class="rank" id="hrank">F</span></div><div class="ttl" id="htitle">見習冒險者</div><div class="xpb"><i id="xpbar"></i><span id="xptxt">0 / 80 XP</span></div></div>
 </div>
 <div class="stats">
  <div class="stat"><svg class="ic"><use href="#i-steps"/></svg><div><b id="steps">0</b><small>步數</small></div></div>
  <div class="stat"><svg class="ic"><use href="#i-compass"/></svg><div><b id="km">0.00</b><small>公里</small></div></div>
  <div class="stat"><svg class="ic"><use href="#i-castle"/></svg><div><b id="cnt">0</b><small>城市</small></div></div>
  <div class="stat"><svg class="ic"><use href="#i-crown"/></svg><div><b id="ms">0</b><small>國家</small></div></div>
 </div>
</header>
<div id="hint" class="frame sm"></div>
<nav id="bar" class="frame">
 <button id="bStart"><svg class="ic"><use href="#i-flag"/></svg><span>起點</span></button>
 <button id="bGps"><svg class="ic"><use href="#i-orb"/></svg><span>追蹤</span></button>
 <button id="bDemo" class="main"><i class="portal"><svg class="ring" viewBox="0 0 100 100"></svg><svg class="ic"><use href="#i-boot"/></svg></i><span>模擬</span></button>
 <button id="bLayer"><svg class="ic"><use href="#i-scroll"/></svg><span>圖層</span></button>
 <button id="bAch"><svg class="ic"><use href="#i-shield"/></svg><span>公會</span></button>
</nav>
<div id="scrim"></div>
<section id="panel" class="sheet"><div class="handle" id="handle"></div><div class="ph"><b id="ptitle"></b><button id="pclose" aria-label="關閉">✕</button></div><div id="pbody"></div></section>
<div id="toast"></div>
<div id="stamp" class="fx hide"></div>
<div id="lvup" class="fx hide"></div>
<div id="onb" class="hide"><div class="onb-card frame">
 <div class="onb-art" id="onbArt"></div>
 <div class="onb-steps">
  <div class="onb-s on"><h2>歡迎來到異世界，旅人</h2><p>你被召喚到一個被迷霧籠罩的世界。每踏出一步，迷霧就會為你退散。</p></div>
  <div class="onb-s"><h2>立下旅程的起點</h2><p>以 GPS 或輕觸地圖選定你的召喚之地。小勇者將與你同行，記下每一步與每一里。</p></div>
  <div class="onb-s"><h2>水晶傳送點</h2><p>全球 6,000+ 座城市化為水晶。抵達後在冒險者護照蓋下魔法印記，留下旅途的回憶。</p></div>
  <div class="onb-s"><h2>公會與稱號</h2><p>行走、打卡、征服國家都能獲得經驗值。升級、解鎖稱號，成為傳說中的冒險者！</p></div>
 </div>
 <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
 <button class="btn wide" id="onbNext">下一步</button><button class="link" id="onbSkip">略過</button>
</div></div>
<script src="config.js"></script><script src="cities.js"></script><script src="vendor/leaflet.js"></script><script src="vendor/leaflet.markercluster.js"></script><script src="app.js"></script><script src="native.js"></script>
</body></html>
